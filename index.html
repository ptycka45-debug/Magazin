  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-cream: #FDECE0;
      --lilac-pale: #F5EDF7;
      --plum: #7C6374;
      --mauve-soft: #E4DAE6;
      --terracotta: #DC9F87;
      --caramel: #C0834A;
      --olive: #5A741E;
      --peach: #FCE1C6;
      --sage: #EAEDD2;
      --blush: #FCE8E6;
      --pistachio: #B2D993;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-cream);
      color: #3b2d36;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="min-h-screen pb-10">

  <!-- Компактная шапка в палитре -->
  <header style="background-color: #7C6374;" class="text-white shadow-md">
    <div class="max-w-3xl mx-auto px-3.5 py-3.5">
      <div class="flex items-center justify-between gap-2.5">
        <div class="flex items-center gap-3 min-w-0">
          <div style="background-color: #634d5c; border-color: #9e8496;" class="w-10 h-10 rounded-xl border flex items-center justify-center shrink-0">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none">
              <rect x="6" y="4" width="4" height="7" rx="2" fill="#C0834A"/>
              <rect x="11" y="3" width="4" height="8" rx="1" fill="#FDECE0"/>
              <circle cx="16.5" cy="7.5" r="2.5" fill="#B2D993"/>
              <path d="M4 11h16l-1.6 8.2a1.5 1.5 0 0 1-1.47 1.2H7.07a1.5 1.5 0 0 1-1.47-1.2L4 11Z" fill="#FCE1C6"/>
              <rect x="3" y="9.5" width="18" height="2.4" rx="1.2" fill="#F5EDF7"/>
              <path d="M7 9.5L9.5 5.5M17 9.5L14.5 5.5" stroke="#B2D993" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M8.5 14v4M12 14v4M15.5 14v4" stroke="#7C6374" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="min-w-0">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight truncate">Выгодная покупка</h1>
            <p style="color: #F5EDF7;" class="text-xs sm:text-sm truncate">Честная цена за 1 кг, 1 литр или 1 шт.</p>
          </div>
        </div>

        <button id="installAppBtn" onclick="installPWA()" style="background-color: #FCE1C6; color: #4a3525; border-color: #C0834A;" class="hidden px-3 py-1.5 rounded-xl font-extrabold text-xs sm:text-sm border shadow-xs transition items-center gap-1 shrink-0">
          <span>Установить</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-3 pt-3 space-y-2.5">

    <!-- Переключатель вкладок -->
    <div style="background-color: #F5EDF7; border-color: #E4DAE6;" class="rounded-2xl p-1.5 shadow-xs border grid grid-cols-2 gap-1.5">
      <button id="tabBtn_calc" onclick="switchTab('calc')" class="py-2 px-2.5 rounded-xl font-extrabold text-sm sm:text-base border transition text-center">
        Калькулятор
      </button>
      <button id="tabBtn_saved" onclick="switchTab('saved')" class="py-2 px-2.5 rounded-xl font-extrabold text-sm sm:text-base border transition text-center">
        Сохранённые (<span id="savedCountBadge">0</span>)
      </button>
    </div>

    <!-- ВКЛАДКА 1: КАЛЬКУЛЯТОР -->
    <section id="tab_calc" class="space-y-2.5">

      <!-- Выбор единицы измерения + название товара (исправлена кнопка Очистить!) -->
      <div style="background-color: #F5EDF7; border-color: #E4DAE6;" class="rounded-2xl p-3 shadow-xs border space-y-2.5">
        <div class="grid grid-cols-3 gap-1.5">
          <button id="unitBtn_weight" onclick="setUnitMode('weight')" class="py-2 px-1.5 rounded-xl font-extrabold text-xs sm:text-sm border transition text-center leading-tight">
            Вес (г / кг)
          </button>
          <button id="unitBtn_volume" onclick="setUnitMode('volume')" class="py-2 px-1.5 rounded-xl font-extrabold text-xs sm:text-sm border transition text-center leading-tight">
            Объём (мл / л)
          </button>
          <button id="unitBtn_pieces" onclick="setUnitMode('pieces')" class="py-2 px-1.5 rounded-xl font-extrabold text-xs sm:text-sm border transition text-center leading-tight">
            Штуки / рул.
          </button>
        </div>

        <div class="flex items-center gap-2 w-full">
          <input
            id="groupTitleInput"
            type="text"
            placeholder="Товар (напр. Порошок, Кофе)"
            style="background-color: #ffffff; border-color: #E4DAE6; color: #3b2d36;"
            class="flex-1 min-w-0 h-10 px-3 rounded-xl border text-sm sm:text-base font-bold focus:outline-none"
          />
          <button
            onclick="clearAllItems()"
            style="background-color: #FCE8E6; color: #7c3f46; border-color: #DC9F87;"
            class="h-10 px-3 rounded-xl font-extrabold text-xs sm:text-sm border transition shrink-0 whitespace-nowrap"
          >
            Очистить
          </button>
        </div>
      </div>

      <!-- Компактный баннер итога сравнения -->
      <div id="verdictBanner" class="hidden rounded-2xl px-3.5 py-2.5 shadow-xs border"></div>

      <!-- Компактные карточки вариантов (помещается 3-4 на экране) -->
      <div id="itemsContainer" class="space-y-2"></div>

      <!-- Кнопки добавить вариант и сохранить -->
      <div class="grid grid-cols-2 gap-2 pt-0.5">
        <button
          onclick="addCompareItem()"
          style="background-color: #E4DAE6; color: #4e3b48; border-color: #cbbacc;"
          class="h-11 rounded-2xl font-extrabold text-sm sm:text-base border transition flex items-center justify-center gap-1.5"
        >
          <span>+ Вариант</span>
        </button>

        <button
          onclick="saveCurrentComparison()"
          style="background-color: #5A741E; color: #ffffff; border-color: #465b16;"
          class="h-11 rounded-2xl font-extrabold text-sm sm:text-base border shadow-xs transition flex items-center justify-center gap-1.5"
        >
          <span>Сохранить</span>
        </button>
      </div>
    </section>

    <!-- ВКЛАДКА 2: СОХРАНЁННЫЕ СРАВНЕНИЯ -->
    <section id="tab_saved" class="hidden space-y-3">
      <div style="background-color: #F5EDF7; border-color: #E4DAE6;" class="rounded-2xl p-3.5 shadow-xs border">
        <h2 style="color: #4e3b48;" class="text-lg font-extrabold mb-1">Сохранённые цены</h2>
        <p style="color: #7C6374;" class="text-xs sm:text-sm mb-3">Ваши прошлые расчёты для сверки цен в магазинах.</p>
        <div id="savedListContainer" class="space-y-2.5"></div>
      </div>
    </section>

  </main>

  <script>
    const STORAGE_KEY = 'price_compare_saved_v2';

    let unitMode = 'weight';
    let activeTab = 'calc';
    let items = [
      { id: 1, label: 'Вариант 1', price: '', amount: '', subUnit: 'g', multiplier: '1' },
      { id: 2, label: 'Вариант 2', price: '', amount: '', subUnit: 'g', multiplier: '1' },
      { id: 3, label: 'Вариант 3', price: '', amount: '', subUnit: 'g', multiplier: '1' }
    ];
    let savedComparisons = [];
    let deferredPrompt = null;

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installAppBtn');
      if (btn) {
        btn.classList.remove('hidden');
        btn.classList.add('inline-flex');
      }
    });

    async function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installAppBtn').classList.add('hidden');
    }

    function loadSaved() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) savedComparisons = parsed;
        }
      } catch (e) {}
      updateSavedBadge();
    }

    function persistSaved() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedComparisons));
      } catch (e) {}
      updateSavedBadge();
    }

    function updateSavedBadge() {
      document.getElementById('savedCountBadge').textContent = savedComparisons.length;
    }

    function switchTab(tab) {
      activeTab = tab;
      ['calc', 'saved'].forEach(t => {
        const sec = document.getElementById(`tab_${t}`);
        const btn = document.getElementById(`tabBtn_${t}`);
        if (t === tab) {
          sec.classList.remove('hidden');
          btn.style.backgroundColor = '#7C6374';
          btn.style.color = '#ffffff';
          btn.style.borderColor = '#7C6374';
        } else {
          sec.classList.add('hidden');
          btn.style.backgroundColor = '#E4DAE6';
          btn.style.color = '#4e3b48';
          btn.style.borderColor = '#d2c3d5';
        }
      });
      if (tab === 'saved') renderSavedList();
    }

    function setUnitMode(mode) {
      unitMode = mode;
      ['weight', 'volume', 'pieces'].forEach(m => {
        const btn = document.getElementById(`unitBtn_${m}`);
        if (m === mode) {
          btn.style.backgroundColor = '#7C6374';
          btn.style.color = '#ffffff';
          btn.style.borderColor = '#7C6374';
        } else {
          btn.style.backgroundColor = '#E4DAE6';
          btn.style.color = '#4e3b48';
          btn.style.borderColor = '#d2c3d5';
        }
      });

      const defaultSub = mode === 'weight' ? 'g' : (mode === 'volume' ? 'ml' : 'pcs');
      items.forEach(it => {
        it.subUnit = defaultSub;
      });
      renderItems();
    }

    function addCompareItem() {
      const nextNum = items.length + 1;
      const defaultSub = unitMode === 'weight' ? 'g' : (unitMode === 'volume' ? 'ml' : 'pcs');
      items.push({
        id: Date.now() + Math.random(),
        label: `Вариант ${nextNum}`,
        price: '',
        amount: '',
        subUnit: defaultSub,
        multiplier: '1'
      });
      renderItems();
    }

    function removeCompareItem(id) {
      if (items.length <= 2) return;
      items = items.filter(it => it.id !== id);
      renderItems();
    }

    function clearAllItems() {
      const defaultSub = unitMode === 'weight' ? 'g' : (unitMode === 'volume' ? 'ml' : 'pcs');
      document.getElementById('groupTitleInput').value = '';
      items = [
        { id: 1, label: 'Вариант 1', price: '', amount: '', subUnit: defaultSub, multiplier: '1' },
        { id: 2, label: 'Вариант 2', price: '', amount: '', subUnit: defaultSub, multiplier: '1' },
        { id: 3, label: 'Вариант 3', price: '', amount: '', subUnit: defaultSub, multiplier: '1' }
      ];
      renderItems();
    }

    function onFieldChange(id, field, value) {
      const it = items.find(x => x.id === id);
      if (!it) return;
      it[field] = value;
      updateCalculationsOnly();
    }

    function calcUnitPrice(it) {
      const price = parseFloat(String(it.price).replace(',', '.'));
      const amount = parseFloat(String(it.amount).replace(',', '.'));
      const mult = Math.max(1, parseFloat(String(it.multiplier).replace(',', '.')) || 1);

      if (isNaN(price) || price <= 0 || isNaN(amount) || amount <= 0) {
        return null;
      }

      const totalRaw = amount * mult;

      if (unitMode === 'weight') {
        const kg = it.subUnit === 'kg' ? totalRaw : totalRaw / 1000;
        return { unitPrice: price / kg, unitLabel: '1 кг', totalText: `${formatQty(kg)} кг` };
      } else if (unitMode === 'volume') {
        const liters = it.subUnit === 'l' ? totalRaw : totalRaw / 1000;
        return { unitPrice: price / liters, unitLabel: '1 л', totalText: `${formatQty(liters)} л` };
      } else {
        return { unitPrice: price / totalRaw, unitLabel: '1 шт.', totalText: `${formatQty(totalRaw)} шт.` };
      }
    }

    function formatQty(val) {
      return Number(val.toFixed(3)).toString().replace('.', ',');
    }

    function formatMoney(val) {
      if (val === null || isNaN(val)) return '—';
      return val.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderItems() {
      const container = document.getElementById('itemsContainer');

      container.innerHTML = items.map((it) => {
        let subUnitHtml = '';
        if (unitMode === 'weight') {
          subUnitHtml = `
            <select onchange="onFieldChange(${it.id}, 'subUnit', this.value)" style="background-color: #E4DAE6; color: #4e3b48; border-color: #cbbacc;" class="h-10 px-1.5 rounded-xl border font-extrabold text-sm shrink-0">
              <option value="g" ${it.subUnit === 'g' ? 'selected' : ''}>г</option>
              <option value="kg" ${it.subUnit === 'kg' ? 'selected' : ''}>кг</option>
            </select>
          `;
        } else if (unitMode === 'volume') {
          subUnitHtml = `
            <select onchange="onFieldChange(${it.id}, 'subUnit', this.value)" style="background-color: #E4DAE6; color: #4e3b48; border-color: #cbbacc;" class="h-10 px-1.5 rounded-xl border font-extrabold text-sm shrink-0">
              <option value="ml" ${it.subUnit === 'ml' ? 'selected' : ''}>мл</option>
              <option value="l" ${it.subUnit === 'l' ? 'selected' : ''}>л</option>
            </select>
          `;
        } else {
          subUnitHtml = `
            <span style="background-color: #E4DAE6; color: #4e3b48; border-color: #cbbacc;" class="h-10 px-2 rounded-xl border font-extrabold text-xs sm:text-sm flex items-center shrink-0">шт.</span>
          `;
        }

        const placeholderQty = unitMode === 'weight' ? '850' : (unitMode === 'volume' ? '930' : '15');

        return `
          <article id="card_${it.id}" style="background-color: #F5EDF7; border-color: #E4DAE6;" class="rounded-2xl p-2.5 sm:p-3 shadow-xs border-2 space-y-2 transition">
            <!-- Строка 1: Название + бейдж + итоговая цена за единицу сразу справа -->
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0 flex-1">
                <input
                  type="text"
                  value="${escapeHtml(it.label)}"
                  oninput="onFieldChange(${it.id}, 'label', this.value)"
                  style="color: #4e3b48; border-color: #cbbacc;"
                  class="font-extrabold text-sm sm:text-base bg-transparent border-b border-dashed focus:outline-none w-28 sm:w-40 min-w-0"
                  placeholder="Вариант"
                />
                <span id="badge_${it.id}" class="hidden px-2 py-0.5 rounded-full text-[11px] sm:text-xs font-extrabold whitespace-nowrap"></span>
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <div id="result_${it.id}" class="text-right">
                  <span style="color: #9e8496;" class="text-sm font-extrabold">—</span>
                </div>
                ${items.length > 2 ? `
                  <button onclick="removeCompareItem(${it.id})" style="background-color: #FCE8E6; color: #8c464e; border-color: #DC9F87;" class="w-7 h-7 rounded-lg font-bold text-xs border flex items-center justify-center" title="Удалить">✕</button>
                ` : ''}
              </div>
            </div>

            <!-- Строка 2: Все поля в ОДНУ компактную линию (Цена | Вес/Объём/Шт | Пачек) -->
            <div class="grid grid-cols-12 gap-1.5 items-end">
              <!-- Цена (5 колонок) -->
              <div class="col-span-5">
                <label style="color: #7C6374;" class="block text-[11px] font-bold mb-0.5">Цена (₽)</label>
                <div class="relative">
                  <input
                    type="number"
                    step="0.01"
                    inputmode="decimal"
                    value="${escapeHtml(it.price)}"
                    oninput="onFieldChange(${it.id}, 'price', this.value)"
                    placeholder="200"
                    style="background-color: #ffffff; border-color: #E4DAE6; color: #3b2d36;"
                    class="w-full h-10 pl-2.5 pr-6 rounded-xl border text-base sm:text-lg font-extrabold focus:outline-none"
                  />
                  <span style="color: #9e8496;" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-bold pointer-events-none">₽</span>
                </div>
              </div>

              <!-- Количество / Вес (5 колонок) -->
              <div class="col-span-5">
                <label style="color: #7C6374;" class="block text-[11px] font-bold mb-0.5">${unitMode === 'weight' ? 'Вес' : (unitMode === 'volume' ? 'Объём' : 'Кол-во')}</label>
                <div class="flex gap-1">
                  <input
                    type="number"
                    step="0.01"
                    inputmode="decimal"
                    value="${escapeHtml(it.amount)}"
                    oninput="onFieldChange(${it.id}, 'amount', this.value)"
                    placeholder="${placeholderQty}"
                    style="background-color: #ffffff; border-color: #E4DAE6; color: #3b2d36;"
                    class="w-full min-w-0 h-10 px-2.5 rounded-xl border text-base sm:text-lg font-extrabold focus:outline-none"
                  />
                  ${subUnitHtml}
                </div>
              </div>

              <!-- Пачек (2 колонки) -->
              <div class="col-span-2">
                <label style="color: #7C6374;" class="block text-[11px] font-bold mb-0.5 text-center">Пачек</label>
                <input
                  type="number"
                  min="1"
                  step="1"
                  inputmode="numeric"
                  value="${escapeHtml(it.multiplier)}"
                  oninput="onFieldChange(${it.id}, 'multiplier', this.value)"
                  style="background-color: #ffffff; border-color: #E4DAE6; color: #3b2d36;"
                  class="w-full h-10 px-1 text-center rounded-xl border text-base font-extrabold focus:outline-none"
                />
              </div>
            </div>
          </article>
        `;
      }).join('');

      updateCalculationsOnly();
    }

    function updateCalculationsOnly() {
      const calculated = items.map(it => ({
        item: it,
        calc: calcUnitPrice(it)
      }));

      const valid = calculated.filter(x => x.calc !== null);
      let minUnitPrice = Infinity;
      let maxUnitPrice = -Infinity;

      valid.forEach(x => {
        if (x.calc.unitPrice < minUnitPrice) minUnitPrice = x.calc.unitPrice;
        if (x.calc.unitPrice > maxUnitPrice) maxUnitPrice = x.calc.unitPrice;
      });

      const hasComparison = valid.length >= 2 && maxUnitPrice > minUnitPrice;

      calculated.forEach(({ item, calc }) => {
        const card = document.getElementById(`card_${item.id}`);
        const badge = document.getElementById(`badge_${item.id}`);
        const resBox = document.getElementById(`result_${item.id}`);
        if (!card || !badge || !resBox) return;

        if (!calc) {
          card.style.backgroundColor = '#F5EDF7';
          card.style.borderColor = '#E4DAE6';
          badge.className = 'hidden';
          resBox.innerHTML = `<span style="color: #9e8496;" class="text-sm font-extrabold">—</span>`;
          return;
        }

        const isWinner = hasComparison && Math.abs(calc.unitPrice - minUnitPrice) < 0.0001;
        const overpayPct = hasComparison && !isWinner
          ? Math.round(((calc.unitPrice - minUnitPrice) / minUnitPrice) * 100)
          : 0;

        if (isWinner) {
          // Салатово-оливковый акцент из палитры (#EAEDD2 фон, #5A741E рамка и бейдж)
          card.style.backgroundColor = '#EAEDD2';
          card.style.borderColor = '#5A741E';
          badge.className = 'px-2 py-0.5 rounded-full text-[11px] sm:text-xs font-extrabold whitespace-nowrap';
          badge.style.backgroundColor = '#5A741E';
          badge.style.color = '#ffffff';
          badge.textContent = 'ВЫГОДНЕЕ';
        } else if (hasComparison) {
          // Пудрово-розовый / терракотовый из палитры (#FCE8E6 фон бейджа, #DC9F87 рамка)
          card.style.backgroundColor = '#F5EDF7';
          card.style.borderColor = '#DC9F87';
          badge.className = 'px-2 py-0.5 rounded-full text-[11px] sm:text-xs font-extrabold whitespace-nowrap border';
          badge.style.backgroundColor = '#FCE8E6';
          badge.style.color = '#8c464e';
          badge.style.borderColor = '#DC9F87';
          badge.textContent = `+${overpayPct}%`;
        } else {
          card.style.backgroundColor = '#F5EDF7';
          card.style.borderColor = '#E4DAE6';
          badge.className = 'hidden';
        }

        resBox.innerHTML = `
          <span style="color: ${isWinner ? '#5A741E' : '#7C6374'};" class="text-base sm:text-lg font-black">
            ${formatMoney(calc.unitPrice)} ₽
          </span>
          <span style="color: #7C6374;" class="text-xs font-bold"> / ${calc.unitLabel}</span>
        `;
      });

      const banner = document.getElementById('verdictBanner');
      if (hasComparison) {
        const winners = valid.filter(x => Math.abs(x.calc.unitPrice - minUnitPrice) < 0.0001);
        const losers = valid.filter(x => Math.abs(x.calc.unitPrice - minUnitPrice) >= 0.0001);
        const worst = losers.reduce((a, b) => a.calc.unitPrice > b.calc.unitPrice ? a : b);
        const diffPerUnit = worst.calc.unitPrice - minUnitPrice;
        const savePct = Math.round((diffPerUnit / worst.calc.unitPrice) * 100);

        banner.className = 'rounded-2xl px-3.5 py-2.5 shadow-xs border-2';
        banner.style.backgroundColor = '#5A741E';
        banner.style.borderColor = '#465b16';
        banner.style.color = '#ffffff';
        banner.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-1 text-xs sm:text-sm font-bold">
            <span>Выгоднее: <strong class="underline">${escapeHtml(winners.map(w => w.item.label).join(' и '))}</strong></span>
            <span style="background-color: #B2D993; color: #2b380d;" class="px-2 py-0.5 rounded-full text-xs font-extrabold">
              Экономия ${formatMoney(diffPerUnit)} ₽ / ${winners[0].calc.unitLabel} (-${savePct}%)
            </span>
          </div>
        `;
      } else if (valid.length >= 2 && Math.abs(maxUnitPrice - minUnitPrice) < 0.0001) {
        banner.className = 'rounded-2xl px-3.5 py-2.5 shadow-xs border text-xs sm:text-sm font-extrabold';
        banner.style.backgroundColor = '#FCE1C6';
        banner.style.borderColor = '#C0834A';
        banner.style.color = '#4a3525';
        banner.innerHTML = `Варианты стоят одинаково за ${valid[0].calc.unitLabel}!`;
      } else {
        banner.className = 'hidden';
      }
    }

    function saveCurrentComparison() {
      const valid = items.map(it => ({ ...it, calc: calcUnitPrice(it) })).filter(x => x.calc !== null);
      if (!valid.length) {
        alert('Сначала введите цену и вес/объём хотя бы для одного варианта.');
        return;
      }

      valid.sort((a, b) => a.calc.unitPrice - b.calc.unitPrice);
      const titleInput = document.getElementById('groupTitleInput').value.trim();
      const title = titleInput || `${valid[0].label} (${valid[0].calc.unitLabel})`;

      savedComparisons.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString('ru-RU'),
        title,
        unitMode,
        variants: valid.map(v => ({
          label: v.label,
          price: parseFloat(String(v.price).replace(',', '.')),
          totalText: v.calc.totalText,
          unitPrice: v.calc.unitPrice,
          unitLabel: v.calc.unitLabel
        }))
      });

      persistSaved();
      alert('Сравнение сохранено во вкладку «Сохранённые»!');
    }

    function deleteSaved(id) {
      savedComparisons = savedComparisons.filter(s => s.id !== id);
      persistSaved();
      renderSavedList();
    }

    function renderSavedList() {
      const container = document.getElementById('savedListContainer');
      if (!savedComparisons.length) {
        container.innerHTML = '<div style="color: #7C6374;" class="p-4 text-center text-sm">Пока нет сохранённых расчётов.</div>';
        return;
      }

      container.innerHTML = savedComparisons.map(entry => {
        const rows = entry.variants.map((v, i) => `
          <div class="flex items-center justify-between gap-2 py-1.5 text-xs sm:text-sm" style="color: ${i === 0 ? '#5A741E' : '#4e3b48'}; font-weight: ${i === 0 ? '800' : '600'};">
            <span>${i === 0 ? '★ ' : ''}${escapeHtml(v.label)} <span style="color: #7C6374; font-weight: 500;">(${formatMoney(v.price)} ₽ / ${v.totalText})</span></span>
            <span class="whitespace-nowrap">${formatMoney(v.unitPrice)} ₽ / ${v.unitLabel}</span>
          </div>
        `).join('');

        return `
          <div style="background-color: #FDECE0; border-color: #DC9F87;" class="p-3 rounded-2xl border space-y-1.5">
            <div style="border-color: #E4DAE6;" class="flex items-center justify-between gap-2 border-b pb-1.5">
              <div>
                <div style="color: #3b2d36;" class="text-base font-extrabold">${escapeHtml(entry.title)}</div>
                <div style="color: #7C6374;" class="text-xs font-semibold">${entry.date}</div>
              </div>
              <button onclick="deleteSaved(${entry.id})" style="background-color: #FCE8E6; color: #8c464e; border-color: #DC9F87;" class="px-2.5 py-1 rounded-xl font-bold text-xs border">
                Удалить
              </button>
            </div>
            <div>${rows}</div>
          </div>
        `;
      }).join('');
    }

    loadSaved();
    switchTab('calc');
    setUnitMode('weight');
  </script>
</body>
</html>
